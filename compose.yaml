services:
  dockge:
    image: dockge-pbs:latest
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
      - PBS_ENABLED=${PBS_ENABLED}
      - PBS_HOST=${PBS_HOST}
      - PBS_PORT=${PBS_PORT}
      - PBS_DATASTORE=${PBS_DATASTORE}
      - PBS_AUTH_ID=${PBS_AUTH_ID}
      - PBS_SECRET=${PBS_SECRET}
      - PBS_FINGERPRINT=${PBS_FINGERPRINT}
      - PBS_NAMESPACE=${PBS_NAMESPACE}
      - PBS_BACKUP_ID=${PBS_BACKUP_ID}
      - PBS_ENCRYPTION_PASSWORD=${PBS_ENCRYPTION_PASSWORD}
